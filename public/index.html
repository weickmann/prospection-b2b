<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prospection B2B</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='14'>🎯</text></svg>">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <div class="marque">
    <h1>Prospection B2B</h1>
    <small>sourcing · enrichissement · scoring · rédaction</small>
  </div>
  <div class="compteurs" id="compteurs"></div>
  <button class="discret" id="theme" title="Basculer clair / sombre" aria-label="Basculer clair / sombre">
    <svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true">
      <circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.4"/>
      <path d="M8 1.5a6.5 6.5 0 0 1 0 13z" fill="currentColor"/>
    </svg>
  </button>
</header>

<nav>
  <button data-onglet="icp" aria-current="true">Profil cible</button>
  <button data-onglet="pipeline">Pipeline</button>
  <button data-onglet="reglages">Réglages</button>
</nav>

<main>
  <div id="travaux"></div>
  <section id="vue-icp" class="vue"></section>
  <section id="vue-pipeline" class="vue" hidden></section>
  <section id="vue-reglages" class="vue" hidden></section>
</main>

<div id="toasts"></div>
<script type="module" src="/app.js"></script>
</body>
</html>
